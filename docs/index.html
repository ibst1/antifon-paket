const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(DATA.salt), iterations:DATA.iterations, hash:'SHA-256' },
                                           material, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(DATA.iv) }, key, b64(DATA.text));
  return new TextDecoder().decode(plain);
}
async function show(pw, quiet) {
  const msg = document.getElementById('msg');
  msg.textContent = quiet ? '' : 'Låser upp …';
  try {
    const html = await open(pw);
    try { sessionStorage.setItem('antifon-sida', pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { sessionStorage.removeItem('antifon-sida'); } catch (e2) {}
    msg.textContent = quiet ? '' : 'Fel lösenord.';
  }
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); show(document.getElementById('pw').value.trim(), false); };
try { const saved = sessionStorage.getItem('antifon-sida'); if (saved) show(saved, true); } catch (e) {}
